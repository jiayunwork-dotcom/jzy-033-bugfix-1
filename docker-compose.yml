services:
  cubic-window:
    build: .
    image: cubic-window-service:1.0.0
    container_name: cubic-window-service
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2); sys.exit(0 if json.load(r)['status']=='ok' else 1)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
